openapi: 3.1.0
info:
  title: Thesis Rewriting Platform API
  version: 0.1.0-beta
  description: |
    Authenticated REST contract for the current beta. Product endpoints are
    served below `/api`; Auth.js owns the `/auth` routes. Mutations may include
    `X-Mutation-Id` so clients can correlate the REST response with a committed
    Socket.IO event.
servers:
  - url: http://localhost:3001
    description: Local Express server
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Documents
  - name: Trash
  - name: Versions
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check API availability
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /auth/session:
    get:
      tags: [Authentication]
      summary: Read the Auth.js browser session
      description: Returns Auth.js session data or an empty session according to Auth.js semantics.
      responses:
        '200':
          description: Session result
  /auth/signin/google:
    post:
      tags: [Authentication]
      summary: Begin Google OAuth sign-in
      description: Auth.js form action that redirects the browser to Google account selection.
      responses:
        '302':
          description: Redirect to the OAuth provider
  /auth/signout:
    post:
      tags: [Authentication]
      summary: End the current Auth.js session
      responses:
        '302':
          description: Redirect after sign-out
  /api/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated Auth.js user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Auth.js user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me:
    get:
      tags: [Profile]
      summary: Read the product profile and aggregate writing statistics
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Product profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me/activity:
    post:
      tags: [Profile]
      summary: Record one idempotent local-calendar-day activity
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeZone]
              properties:
                timeZone:
                  type: string
                  description: Valid IANA time zone, such as America/Toronto.
      responses:
        '200':
          description: Updated profile and streak
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/users/me/profile-picture:
    get:
      tags: [Profile]
      summary: Download the authenticated user's profile picture
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Image bytes
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profile]
      summary: Replace the authenticated user's profile picture
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/documents:
    get:
      tags: [Documents]
      summary: List active documents
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive title filter
        - name: sort
          in: query
          schema:
            type: string
            enum: [most_recent, least_recent, most_completed, least_completed]
            default: most_recent
      responses:
        '200':
          description: Active document summaries
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
    post:
      tags: [Documents]
      summary: Create a blank document
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '201':
          description: Blank document with its initial processing block and version
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
  /api/documents/{documentId}/blocks/{blockId}/rewrites:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    get:
      tags: [Documents]
      summary: Read cached rewrite tones and background-job states for a block identity
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Rewrite identity, cached options, and jobs }
    post:
      tags: [Documents]
      summary: Generate or force-regenerate a rewrite tone
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Persisted rewrite result and echoed identity }
  /api/documents/{documentId}/blocks/{blockId}/rewrites/prewarm:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    post:
      tags: [Documents]
      summary: Queue this block and the next five eligible Unprocessed blocks
      security: [{ cookieAuth: [] }]
      responses:
        '202': { description: Deduplicated queued or cached jobs }
  /api/documents/{documentId}/blocks/{blockId}/analysis:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    post:
      tags: [Documents]
      summary: Analyze one block with explicit clear or issues-found results per requested filter
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Cached or newly persisted analysis }
  /api/documents/{documentId}/blocks/{blockId}/practice-feedback:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    post:
      tags: [Documents]
      summary: Coach a saved rewrite attempt using the matching current analysis
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Cached or newly persisted feedback and exact attempt text }
        '409': { description: Matching current analysis is required }
  /api/documents/upload:
    post:
      tags: [Documents]
      summary: Upload and resolve a TXT, Markdown, or DOCX document
      description: The server converts the file into formatting-aware logical blocks before persistence.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Supported extensions are `.txt`, `.md`, and `.docx`.
                academicStyle:
                  $ref: '#/components/schemas/AcademicStyle'
      responses:
        '201':
          description: Imported document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: File exceeds the 2.5 MB limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/documents/trash/check-expired:
    post:
      tags: [Trash]
      summary: Permanently delete this user's trash items older than the retention period
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Permanently deleted document identities
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: array
                    items: { $ref: '#/components/schemas/DeletedDocument' }
  /api/documents/{documentId}:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      summary: Read one active document and all of its blocks
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Full document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Documents]
      summary: Save a document draft and optionally create a version
      description: A supplied `contentJson` replaces canonical blocks and recomputes progress atomically.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSaveRequest'
      responses:
        '200':
          description: Canonical saved document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      summary: Move an active document to trash
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Trashed document summary
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/DocumentSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents/{documentId}/rate:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      summary: Read document progress counters
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Progress counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRate'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents/{documentId}/export:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      summary: Export the current persisted document as DOCX
      description: Preserves document structure, rich-text marks, academic style settings, margins, and page-number placement.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Downloadable Word document
          headers:
            Content-Disposition:
              description: Attachment filename derived from the document title.
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents/{documentId}/blocks/{blockId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    patch:
      tags: [Documents]
      summary: Set a block status and advance processing when appropriate
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/BlockStatus' }
      responses:
        '200':
          description: Canonical document and next processing block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents/{documentId}/blocks/{blockId}/skip:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    post:
      tags: [Documents]
      summary: Mark a block skipped and choose the next processing block
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Canonical block mutation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockMutationResponse' }
  /api/documents/{documentId}/blocks/{blockId}/complete:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/BlockId'
    post:
      tags: [Documents]
      summary: Mark a block processed and choose the next processing block
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Canonical block mutation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockMutationResponse' }
  /api/documents/{documentId}/versions:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Versions]
      summary: List versions for an active document
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Version metadata in descending version order
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentVersion' }
  /api/documents/{documentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Versions]
      summary: Read one immutable version snapshot
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Version snapshot
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { $ref: '#/components/schemas/DocumentVersionSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents/{documentId}/revert:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    post:
      tags: [Versions]
      summary: Replace a document with a stored version snapshot
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Reverted canonical document and a new version record
          content:
            application/json:
              schema:
                type: object
                required: [document, version]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  version: { $ref: '#/components/schemas/DocumentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trash:
    get:
      tags: [Trash]
      summary: List the authenticated user's trashed documents
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Trashed document summaries
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
  /api/trash/{documentId}/restore:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    post:
      tags: [Trash]
      summary: Restore one document from trash
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Restored document summary
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/DocumentSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trash/{documentId}:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    delete:
      tags: [Trash]
      summary: Permanently delete one trashed document
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MutationId' }]
      responses:
        '200':
          description: Deleted document identity
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/DeletedDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Auth.js database-session cookie. The exact cookie name can vary by deployment security settings.
  parameters:
    MutationId:
      name: X-Mutation-Id
      in: header
      required: false
      schema: { $ref: '#/components/schemas/Uuid' }
      description: Optional client-generated UUID echoed in the related realtime event.
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  responses:
    BadRequest:
      description: Invalid request body, identifier, or file
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired, or untrusted authenticated session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist for the authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Uuid:
      type: string
      format: uuid
    AcademicStyle:
      type: string
      enum: [APA, MLA, Chicago, Customized]
    BlockStatus:
      type: string
      enum: [unprocessed, processing, processed, skipped]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [AI_NOT_CONFIGURED, AI_RATE_LIMITED, AI_TIMEOUT, AI_INVALID_OUTPUT, AI_PERSISTENCE_FAILED, STALE_BLOCK_CONTEXT, ANALYSIS_REQUIRED]
        correlationId: { type: string, format: uuid }
    AuthUser:
      type: object
      required: [id, email]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: [string, 'null'] }
        email: { type: string, format: email }
        image: { type: [string, 'null'], format: uri }
    UserStats:
      type: object
      required: [completed_chars, total_chars, completed_rate, streak_day_count]
      properties:
        completed_chars: { type: integer, minimum: 0 }
        total_chars: { type: integer, minimum: 0 }
        completed_rate: { type: number, minimum: 0, maximum: 1 }
        streak_day_count: { type: integer, minimum: 0 }
        streak_start_date: { type: [string, 'null'], format: date }
        streak_end_date: { type: [string, 'null'], format: date }
        streak_days:
          type: array
          items: { type: string, format: date }
        last_active_on: { type: [string, 'null'], format: date }
        time_zone: { type: [string, 'null'] }
    ProductProfile:
      type: object
      required: [id, auth_user_id, email, hasProfilePicture, stats]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        auth_user_id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        display_name: { type: [string, 'null'] }
        profile_picture_mime: { type: [string, 'null'] }
        hasProfilePicture: { type: boolean }
        stats: { $ref: '#/components/schemas/UserStats' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TiptapNode:
      type: object
      required: [type]
      properties:
        type: { type: string }
        attrs: { type: object, additionalProperties: true }
        content:
          type: array
          items: { $ref: '#/components/schemas/TiptapNode' }
        text: { type: string }
        marks:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true
    TiptapDocument:
      type: object
      required: [type, content]
      properties:
        type: { const: doc }
        content:
          type: array
          items: { $ref: '#/components/schemas/TiptapNode' }
    DocumentBlock:
      type: object
      required: [id, document_id, block_index, text_content, status, char_length, attrs, tiptap_node]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        document_id: { $ref: '#/components/schemas/Uuid' }
        block_index: { type: integer, minimum: 0 }
        text_content: { type: string }
        status: { $ref: '#/components/schemas/BlockStatus' }
        resume_status: { type: [string, 'null'], enum: [unprocessed, processed, skipped, null] }
        processing_baseline_text: { type: [string, 'null'] }
        change_source:
          type: string
          enum: [none, manual, ai-replacement, practice-replacement]
        partition_generation: { type: integer, minimum: 0 }
        format_overrides:
          type: array
          items: { type: string }
        char_length: { type: integer, minimum: 0 }
        attrs: { type: object, additionalProperties: true }
        tiptap_node: { $ref: '#/components/schemas/TiptapNode' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentSummary:
      type: object
      required: [id, title, academic_style, revision, trashed, completed_rate]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        academic_style: { $ref: '#/components/schemas/AcademicStyle' }
        completed_chars: { type: integer, minimum: 0 }
        total_chars: { type: integer, minimum: 0 }
        completed_rate: { type: number, minimum: 0, maximum: 1 }
        current_processing_block_id: { type: [string, 'null'], format: uuid }
        revision: { type: integer, minimum: 1 }
        original_filename: { type: [string, 'null'] }
        trashed: { type: boolean }
        trashed_at: { type: [string, 'null'], format: date-time }
        snippet: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [user_id, style_settings, content_json, blocks]
          properties:
            user_id: { $ref: '#/components/schemas/Uuid' }
            style_settings: { type: object, additionalProperties: true }
            content_json: { $ref: '#/components/schemas/TiptapDocument' }
            original_mime: { type: [string, 'null'] }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/DocumentBlock' }
    DocumentSaveRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        academicStyle: { $ref: '#/components/schemas/AcademicStyle' }
        styleSettings: { type: object, additionalProperties: true }
        contentJson: { $ref: '#/components/schemas/TiptapDocument' }
        createVersion: { type: boolean }
        versionLabel: { type: string, maxLength: 200 }
    DocumentRate:
      type: object
      required: [completed_chars, total_chars, completed_rate, revision]
      properties:
        completed_chars: { type: integer, minimum: 0 }
        total_chars: { type: integer, minimum: 0 }
        completed_rate: { type: number, minimum: 0, maximum: 1 }
        revision: { type: integer, minimum: 1 }
    BlockMutationResponse:
      type: object
      required: [document, revision]
      properties:
        document: { $ref: '#/components/schemas/Document' }
        revision: { type: integer, minimum: 1 }
        nextProcessingBlock:
          oneOf:
            - { $ref: '#/components/schemas/DocumentBlock' }
            - type: 'null'
    DocumentVersion:
      type: object
      required: [id, document_id, version_number, label, academic_style_snapshot, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        document_id: { $ref: '#/components/schemas/Uuid' }
        version_number: { type: integer, minimum: 1 }
        label: { type: string }
        academic_style_snapshot: { $ref: '#/components/schemas/AcademicStyle' }
        text_preview: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    DocumentVersionSnapshot:
      allOf:
        - $ref: '#/components/schemas/DocumentVersion'
        - type: object
          required: [snapshot_json]
          properties:
            snapshot_json: { type: object, additionalProperties: true }
    DeletedDocument:
      type: object
      required: [id, title, revision, deleted]
