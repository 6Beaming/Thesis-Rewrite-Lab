services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thesis_rewriter
      POSTGRES_USER: thesis_rewriter
      POSTGRES_PASSWORD: thesis_rewriter_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis_rewriter -d thesis_rewriter"]
      interval: 5s
      timeout: 5s
      retries: 10

  nlp:
    build:
      context: ./server/nlp_service
    environment:
      SENTENCE_TRANSFORMER_MODEL: sentence-transformers/all-MiniLM-L6-v2
      SENTENCE_TRANSFORMER_REVISION: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
