services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thesis_rewriter
      POSTGRES_USER: thesis_rewriter
      POSTGRES_PASSWORD: thesis_rewriter_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis_rewriter -d thesis_rewriter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
